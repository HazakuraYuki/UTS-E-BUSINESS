<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Geometric accent lines -->
  <path d="M 64 256 Q 256 120 448 256" stroke="#1e293b" stroke-width="4" fill="none" opacity="0.4"/>
  <circle cx="256" cy="256" r="180" stroke="#0e7490" stroke-width="2" stroke-dasharray="8 8" fill="none" opacity="0.4"/>

  <!-- Stylized Fast Delivery Box & Track Icon -->
  <g filter="url(#shadow)">
    <!-- Main Logistics Box / Cube -->
    <path d="M 256 120 L 376 190 L 256 260 L 136 190 Z" fill="url(#brand)"/>
    <path d="M 136 190 L 256 260 L 256 390 L 136 320 Z" fill="#0d9488"/>
    <path d="M 376 190 L 256 260 L 256 390 L 376 320 Z" fill="#047857"/>

    <!-- Dynamic Speed Lines / Road Tracks -->
    <path d="M 200 375 L 256 425 L 312 375" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 224 415 L 256 445 L 288 415" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Center pulse symbol -->
    <circle cx="256" cy="210" r="16" fill="#ffffff" opacity="0.95"/>
    <path d="M 256 195 L 256 225 M 241 210 L 271 210" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
